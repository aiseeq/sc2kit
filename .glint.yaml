# Glint: https://github.com/aiseeq/glint
version: 1

settings:
  exclude:
    - vendor/*
    - bin/*
    - testdata/*
    - "*.md"
    - "*.pb.go"  # сгенерировано protoc из proto/ (make generate)
  min_severity: low
  output: console

categories:
  architecture: {enabled: true}
  duplication: {enabled: true}
  patterns:
    enabled: true
    rules:
      non-canonical-logger:
        exceptions:
          - files: "examples/**"
            reason: "Примеры для пользователей либы: идиоматичный минимальный вывод (log.Fatalf/fmt.Printf) без навязывания логгера"
  typesafety: {enabled: true}
  security: {enabled: true}
  deadcode: {enabled: true}
  naming: {enabled: true}
  documentation: {enabled: true}
