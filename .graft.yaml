# Коммит sc2kit: graft commit -m "…" — гейт, git add -A, проверки, коммит и push.
schema: 1
graft: '>=2.37.0'
# go fix -diff ./... идёт после go vet с его окружением: модернизаторы тулчейна не оставляют правок.
go_fix:
  enabled: true

tasks:
  test:
    desc: все тесты
    tests: go
    run:
      - go test -p {threads} -json {args} ./...
  glint:
    desc: static analysis
    heavy: true
    # Busy machine: the gate sends glint to the remote_heavy host (pc) when the
    # glint here is the copy install recorded there (hosts.json).
    remote: true
    env: {GOWORK: "off"}
    run: [glint check .]

# Гейт: go vet (graft сам, первым шагом), gofmt, тесты и glint (см. порог ниже).
gate:
  - sh: 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
  - task: test
  # glint падает кодом выхода на находке high и выше (fail_on по умолчанию).
  - task: glint

version:
  mode: git-tag

push:
  force_with_lease: ['w/*']

checks:
  large_files:
    max_binary_bytes: 1048576
    max_text_bytes: 1048576
    binary_extensions: [png, jpg, jpeg, gif, webp, pdf, gz, zst, sc2replay]

lock:
  scope: worktree
